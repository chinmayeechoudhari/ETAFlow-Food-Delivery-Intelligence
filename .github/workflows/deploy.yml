name: ETAFlow Deploy (AWS EC2)

# Runs after "ETAFlow CI/CD Pipeline" succeeds on main (or manually). It assumes an AWS role
# through GitHub OIDC (no stored AWS keys), pushes the image to ECR, uploads the compose bundle
# to S3, and tells the EC2 server through SSM to run deploy/remote-deploy.sh.
# Skipped (not failed) until a repo admin sets the repository variables printed by
# deploy/aws/create-stack.ps1. See docs/DEPLOYMENT_GUIDE.md.

on:
  workflow_run:
    workflows: ["ETAFlow CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, push to ECR and deploy to EC2
    # Deploy only pushes to main of THIS repository. CI also runs for pull requests (including
    # from forks), and a PR's CI result must never trigger a deploy of unreviewed code.
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
      BUNDLE_BUCKET: ${{ vars.BUNDLE_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set image tag
        id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t "$ECR_REPOSITORY_URI:$TAG" -t "$ECR_REPOSITORY_URI:latest" .
          docker push "$ECR_REPOSITORY_URI:$TAG"
          docker push "$ECR_REPOSITORY_URI:latest"

      - name: Upload the deploy bundle
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tar -czf bundle.tar.gz docker-compose.yml docker-compose.prod.yml monitoring deploy/remote-deploy.sh
          aws s3 cp bundle.tar.gz "s3://$BUNDLE_BUCKET/bundle/$TAG.tar.gz"

      - name: Deploy on the EC2 server (SSM Run Command)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE="$ECR_REPOSITORY_URI:$TAG"
          PARAMS=$(jq -nc --arg b "$BUNDLE_BUCKET" --arg t "$TAG" --arg i "$IMAGE" --arg r "$AWS_REGION" '{commands: [
            "set -eu",
            "mkdir -p /opt/etaflow",
            "aws s3 cp s3://\($b)/bundle/\($t).tar.gz /tmp/etaflow-bundle.tar.gz --region \($r)",
            "tar -xzf /tmp/etaflow-bundle.tar.gz -C /opt/etaflow",
            "bash /opt/etaflow/deploy/remote-deploy.sh \($i) \($r)"
          ]}')
          CMD_ID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "ETAFlow deploy $TAG" --parameters "$PARAMS" --query Command.CommandId --output text)
          echo "SSM command id: $CMD_ID"

          # Poll for up to 15 minutes (pulling the image on a small server can exceed the CLI waiter's limit).
          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          RESULT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --output json)
          echo "$RESULT" | jq -r '.StandardOutputContent'
          if [ "$STATUS" != "Success" ]; then
            echo "$RESULT" | jq -r '.StandardErrorContent'
            echo "::error::Deploy command finished with status $STATUS"
            exit 1
          fi

      - name: Smoke test the live site
        run: curl --retry 12 --retry-delay 10 --retry-all-errors -fsS "$APP_URL/health"
