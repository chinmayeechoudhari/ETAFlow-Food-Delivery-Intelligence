name: ETAFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: 🧪 Lint, Test & Benchmark Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mlflow

      - name: Copy Environment Configuration
        run: |
          cp .env.example .env

      - name: Run Linter (Ruff)
        run: |
          ruff check src pipelines tests

      - name: Run Unit & Integration Tests (Pytest)
        env:
          PYTHONPATH: src
        run: |
          pytest -v --durations=10

      - name: Run Batch Prediction Pipeline
        env:
          PYTHONPATH: src
        run: |
          python pipelines/batch_predict.py

      - name: Run Latency Benchmark
        env:
          PYTHONPATH: src
        run: |
          python scripts/benchmark_latency.py --iterations 100

      - name: Run Responsible AI Fairness Audit
        env:
          PYTHONPATH: src
        run: |
          python pipelines/audit_fairness.py

      - name: Upload Benchmark & Audit Reports
        uses: actions/upload-artifact@v4
        with:
          name: etaflow-evaluation-reports
          path: reports/

  deploy-to-aws:
    name: 🚀 Build, Push to Amazon ECR & Deploy (AWS)
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'etaflow-delivery-api' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS Secrets Status
        id: check-secrets
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has_aws_creds=true" >> $GITHUB_OUTPUT
            echo "✅ AWS credentials secret keys detected. Proceeding with Amazon ECR delivery."
          else
            echo "has_aws_creds=false" >> $GITHUB_OUTPUT
            echo "ℹ️ AWS credentials (AWS_ACCESS_KEY_ID) not yet configured in GitHub Secrets."
            echo "   CI test gates completed successfully. Refer to docs/AWS_CICD_DEPLOYMENT_GUIDE.md to activate live ECR push."
          fi

      - name: Configure AWS Credentials
        if: steps.check-secrets.outputs.has_aws_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.check-secrets.outputs.has_aws_creds == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        if: steps.check-secrets.outputs.has_aws_creds == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building container: $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          echo "Pushing images to Amazon ECR..."
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to AWS App Runner (Optional Auto-trigger)
        if: steps.check-secrets.outputs.has_aws_creds == 'true' && secrets.APP_RUNNER_SERVICE_ARN != ''
        run: |
          echo "Triggering AWS App Runner deployment for service: ${{ secrets.APP_RUNNER_SERVICE_ARN }}"
          aws apprunner start-deployment --service-arn ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          echo "✅ AWS App Runner deployment initiated successfully."
