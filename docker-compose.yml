version: '3.8'

services:
  etaflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etaflow_platform
    ports:
      - "8000:8000"   # Prediction API Endpoint
      - "8501:8501"   # Operations & MLOps Web Dashboard
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PYTHONPATH=/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

