global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'etaflow-prediction-api'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['etaflow:8000']
        labels:
          app: 'etaflow'
          env: 'production'
          model: 'random_forest_regressor'
