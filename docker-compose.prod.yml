# Production override for the AWS EC2 server. Used together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# deploy/remote-deploy.sh writes ETAFLOW_IMAGE and GRAFANA_ADMIN_PASSWORD into /opt/etaflow/.env.
# Requires Docker Compose v2.24.4+ for the !reset / !override tags.

services:
  etaflow:
    build: !reset null
    image: ${ETAFLOW_IMAGE:?ETAFLOW_IMAGE must be set}
    ports: !override
      - "80:8000"
    mem_limit: 512m

  prometheus:
    mem_limit: 192m

  grafana:
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    mem_limit: 256m
